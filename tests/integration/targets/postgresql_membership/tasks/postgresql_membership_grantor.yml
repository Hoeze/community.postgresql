####################################################################
# Tests for the grantor-scoped membership model.                   #
# PostgreSQL 16 made role membership per-grantor: the same pair can#
# be granted independently by several roles, and a role can only   #
# revoke its own grant. The module therefore manages only the grant#
# made by the connecting role. Before 16 pg_auth_members is unique #
# on (roleid, member), so the grantor is ignored and the behaviour #
# is unchanged.                                                    #
####################################################################

- name: postgresql_membership - get server version
  become_user: "{{ pg_user }}"
  become: true
  postgresql_query:
    login_user: "{{ pg_user }}"
    db: postgres
    query: "SELECT current_setting('server_version_num') AS server_version_num"
  register: pg_ver

- name: postgresql_membership - grantor model (PostgreSQL >= 16 only)
  when: pg_ver.query_result[0].server_version_num | int >= 160000
  block:

  - name: postgresql_membership - create roles for the grantor tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items:
    - "grantor_group"
    - "grantor_user"
    - "grantor_other"

  # grantor_other, not the connecting role, grants the membership. GRANTED BY
  # records the grant under grantor_other without connecting as it.
  - name: postgresql_membership - let another role grant the membership
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ item }}"
    with_items:
    - 'GRANT "grantor_group" TO "grantor_other" WITH ADMIN OPTION'
    - 'GRANT "grantor_group" TO "grantor_user" GRANTED BY "grantor_other"'

  # A membership granted by somebody else is not our grant, so we must make one.
  - name: postgresql_membership - present creates our own grant
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "grantor_group"
      target_role: "grantor_user"
      state: present
    register: result

  - assert:
      that:
      - result is changed

  - name: postgresql_membership - present is idempotent afterwards
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "grantor_group"
      target_role: "grantor_user"
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.grants.grantor_group.grantor_user | map(attribute='grantor') | sort == ['grantor_other', '{{ pg_user }}']

  # Options are the union of every grant, so clearing one on our grant does not
  # clear it while another role's grant still carries it. That must be warned about.
  - name: postgresql_membership - let the other role grant ADMIN too
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: 'GRANT "grantor_group" TO "grantor_user" WITH ADMIN OPTION GRANTED BY "grantor_other"'

  - name: postgresql_membership - clearing an option another grant keeps warns
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "grantor_group"
      target_role: "grantor_user"
      admin_option: false
      state: present
    register: result

  - assert:
      that:
      - result.effective_options.grantor_group.grantor_user.admin_option
      - result.warnings | select('search', 'keeps the ADMIN option') | list | length > 0

  # A plain REVOKE only removes our grant, so the membership survives. The module
  # must revoke what it owns, warn, and then converge instead of reporting a
  # change forever.
  - name: postgresql_membership - absent revokes our grant only
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "grantor_group"
      target_role: "grantor_user"
      state: absent
    register: result

  - assert:
      that:
      - result is changed
      - result.warnings | select('search', 'remains a member') | list | length > 0

  - name: postgresql_membership - absent converges, it does not loop forever
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "grantor_group"
      target_role: "grantor_user"
      state: absent
    register: result

  - assert:
      that:
      - result is not changed

  - name: postgresql_membership - the other role's grant survived
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: >-
        SELECT gr.rolname AS grantor FROM pg_catalog.pg_auth_members m
        JOIN pg_catalog.pg_roles g ON m.roleid = g.oid
        JOIN pg_catalog.pg_roles u ON m.member = u.oid
        JOIN pg_catalog.pg_roles gr ON m.grantor = gr.oid
        WHERE g.rolname = 'grantor_group' AND u.rolname = 'grantor_user'
    register: result

  - assert:
      that:
      - result.query_result | map(attribute='grantor') | list == ['grantor_other']

  always:

  - name: postgresql_membership - drop roles from the grantor tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items:
    - "grantor_user"
    - "grantor_other"
    - "grantor_group"

# Before PostgreSQL 16 the grantor is not part of the membership identity: a pair
# can only be granted once and any role holding ADMIN OPTION can revoke it. The
# module must behave exactly as it did before.
- name: postgresql_membership - grantor ignored before PostgreSQL 16
  when: pg_ver.query_result[0].server_version_num | int < 160000
  block:

  - name: postgresql_membership - create roles for the legacy grantor test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items:
    - "grantor_group"
    - "grantor_user"
    - "grantor_other"

  - name: postgresql_membership - let another role grant the membership
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ item }}"
    with_items:
    - 'GRANT "grantor_group" TO "grantor_other" WITH ADMIN OPTION'
    - 'GRANT "grantor_group" TO "grantor_user" GRANTED BY "grantor_other"'

  - name: postgresql_membership - present stays a no-op on a membership granted by another role
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "grantor_group"
      target_role: "grantor_user"
      state: present
    register: result

  - assert:
      that:
      - result is not changed

  - name: postgresql_membership - absent still removes a membership granted by another role
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "grantor_group"
      target_role: "grantor_user"
      state: absent
    register: result

  - assert:
      that:
      - result is changed

  - name: postgresql_membership - the membership is really gone
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: >-
        SELECT count(*) AS count FROM pg_catalog.pg_auth_members m
        JOIN pg_catalog.pg_roles g ON m.roleid = g.oid
        JOIN pg_catalog.pg_roles u ON m.member = u.oid
        WHERE g.rolname = 'grantor_group' AND u.rolname = 'grantor_user'
    register: result

  - assert:
      that:
      - result.query_result[0].count == 0

  always:

  - name: postgresql_membership - drop roles from the legacy grantor test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items:
    - "grantor_user"
    - "grantor_other"
    - "grantor_group"
